<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelGest - Sistema de Gestión Hotelera (Prototipo)</title>

    <!-- ============================================================
         LIBRERÍAS EXTERNAS (CDN)
         - Bootstrap 5: framework de front end (grid, componentes, utilidades)
         - Bootstrap Icons: iconografía para navbar, tarjetas y botones
    ============================================================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos propios del proyecto, todos modularizados en la carpeta /css.
         El archivo main.css importa e integra el resto de hojas de estilo. -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- ============================================================
         CONTENEDORES PRINCIPALES (esqueleto)
         El contenido real de cada vista se carga dinámicamente
         desde archivos HTML parciales en la carpeta /views mediante
         el módulo JS "views-loader.js".

         - #vista-login:         pantalla de inicio de sesión (pública)
         - #contenedor-interno:  contenedor de las vistas autenticadas
                                 (dashboard, habitaciones, huéspedes, pagos,
                                 formulario) con su navbar y footer común
    ============================================================= -->

    <!-- Pantalla de login (initViews la puebla con views/login.html) -->
    <section id="vista-login" class="vista activa"></section>

    <!-- Contenedor de las vistas internas (initViews lo puebla con
         views/contenido-interno.html). Inicia oculto hasta que el
         usuario inicia sesión. -->
    <div id="contenedor-interno" class="vista"></div>

    <!-- ============================================================
         LIBRERÍAS JS + LÓGICA DE LA APLICACIÓN
         Bootstrap y el módulo principal de la aplicación. main.js
         se encarga de cargar las vistas y de inicializar todos los
         módulos (router, autenticación, filtros, formularios).
    ============================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
