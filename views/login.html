
<header class="bg-primario text-white text-center py-3 position-absolute top-0 start-0 w-100">
    <h1 class="h4 mb-0"></i> Iniciar Sesión</h1>
</header>

<div class="contenedor-login px-3">
    <div class="card tarjeta-login shadow-sm p-4 rounded-3">
        <div class="card-body">
           
           <div class="text-center mb-4">
           <img src="img/logo-horizontal-v2.svg" alt="Logo HotelGest" class="mb-3" style="max-width: 280px; width: 100%;" >
           </div>

            
            <form id="form-login" class="needs-validation" novalidate>

                
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario"
                           placeholder="Ingrese su usuario" required>
                    <div class="invalid-feedback">
                        El usuario es obligatorio.
                    </div>
                </div>

                
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena"
                           placeholder="Ingrese su contraseña" required minlength="4">
                    <div class="invalid-feedback">
                        La contraseña debe tener al menos 4 caracteres.
                    </div>
                </div>

                
                <div class="mb-3">
                    <label for="rol-login" class="form-label">Rol (simulado para el prototipo)</label>
                    <select class="form-select" id="rol-login">
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="RECEPCIONISTA">Recepcionista</option>
                        <option value="HUESPED">Huésped</option>
                    </select>
                </div>

                
                <button type="submit" class="btn btn-primario w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </button>
            </form>
        </div>
    </div>
</div>


<footer class="footer-hotel text-center py-2 position-absolute bottom-0 start-0 w-100 small">
    &copy; 2026 HotelGest - Proyecto de Desarrollo web
</footer>
