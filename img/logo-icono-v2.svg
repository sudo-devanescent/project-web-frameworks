<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fondoGradV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#407cb1"/>
      <stop offset="100%" stop-color="#265b92"/>
    </linearGradient>
    <mask id="ojoLlave">
      <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>
      <circle cx="100" cy="100" r="7" fill="#000000"/>
    </mask>
  </defs>

  <!-- Anillo exterior fino (detalle de medalla/insignia) -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#becddd" stroke-width="1.5"/>

  <!-- Círculo principal con degradado de marca -->
  <circle cx="100" cy="100" r="90" fill="url(#fondoGradV2)"/>

  <!-- Monograma "H" con ojo de cerradura en el travesaño -->
  <g mask="url(#ojoLlave)" fill="#ffffff">
    <rect x="68" y="64" width="14" height="72" rx="2"/>
    <rect x="118" y="64" width="14" height="72" rx="2"/>
    <rect x="68" y="93" width="64" height="14" rx="2"/>
  </g>
</svg>
